# nav-fim

[project.theme]
variant = "modern"
language = "pt-BR"
logo = "assets/brasao.png"
favicon = "assets/brasao.png"
features = [
  # Sem "navigation.sections": cada categoria vira um item recolhível no menu lateral,
  # e só a categoria da página aberta fica expandida
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
  "toc.follow",
]


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Modo claro"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
