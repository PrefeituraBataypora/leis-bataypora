# nav-fim

[project.theme]
variant = "modern"
language = "pt-BR"
logo = "assets/brasao.png"
favicon = "assets/brasao.png"
features = [
  # Sem "navigation.sections": cada categoria vira um item recolhível no menu lateral,
  # e só a categoria da página aberta fica expandida
  "navigation.indexes",
  # cada página leva só o ramo aberto do menu (com ~1.900 leis, o menu inteiro em toda página passava de 500 KB por página
  # e o site de 1 GB, o limite do GitHub Pages)
  "navigation.prune",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
  "toc.follow",
]


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Modo claro"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
# cartões da página inicial: HTML com Markdown dentro e ícones do Material (:material-bank:)
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
